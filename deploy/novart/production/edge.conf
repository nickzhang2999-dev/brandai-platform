worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 200m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Recreated web containers can have a new IP on every release/rollback.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 80;
        server_name _;
        if ($http_x_forwarded_proto != https) { return 308 https://deepflare.cn$request_uri; }
        if ($host != deepflare.cn) { return 308 https://deepflare.cn$request_uri; }
        location / {
            set $web_upstream web:3000;
            proxy_pass http://$web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
