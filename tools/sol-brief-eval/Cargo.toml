[package]
name = "sol-brief-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
backoff = "0.4"
async-openai = { version = "=0.28.3", default-features = false, features = ["rustls-webpki-roots"] }
rig-core = { version = "=0.13.0", default-features = false, features = ["reqwest-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
