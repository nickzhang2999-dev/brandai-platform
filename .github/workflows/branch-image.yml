name: Branch Image

# Publish immutable images for main and the isolated Novart branches. Deployment is a separate gate.
on:
  push:
    branches: [main, devUpdate1012, claude/novart-product-integration, claude/layer-quality, fix/p1-remove-captured-bundle, fix/p2-security, fix/p3-ai-reliability, fix/p4-frontend, chore/p5-engineering]
    paths:
      - 'cds-release.sh'
      - 'scripts/test-project-release.mjs'
      - 'scripts/test-novart-production.mjs'
      - 'scripts/*novart*.py'
      - 'scripts/*novart*.cjs'
      - 'scripts/test-writing-workbench-browser.cjs'
      - 'scripts/writing-workbench-fixture.cjs'
      - 'scripts/check-owned-*.cjs'
      - '.github/workflows/branch-image.yml'
      - '.github/workflows/novart-integration.yml'
      - 'apps/**'
      - 'packages/**'
      - 'deploy/novart/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: novart-preview-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devUpdate1012' || github.ref == 'refs/heads/claude/novart-product-integration' || github.ref == 'refs/heads/claude/layer-quality' || github.ref == 'refs/heads/fix/p1-remove-captured-bundle' || github.ref == 'refs/heads/fix/p2-security' || github.ref == 'refs/heads/fix/p3-ai-reliability' || github.ref == 'refs/heads/fix/p4-frontend' || github.ref == 'refs/heads/chore/p5-engineering'
    uses: ./.github/workflows/novart-integration.yml
