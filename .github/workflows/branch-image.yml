name: Branch Image

# Every project branch must pass the same immutable-image gate. Production remains main-only.
on:
  push:
    branches: ['**']
    paths:
      - 'cds-release.sh'
      - 'scripts/test-project-release.mjs'
      - 'scripts/test-novart-production.mjs'
      - 'scripts/*novart*.py'
      - 'scripts/*novart*.cjs'
      - '.github/workflows/branch-image.yml'
      - '.github/workflows/novart-integration.yml'
      - 'apps/**'
      - 'packages/**'
      - 'deploy/novart/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: novart-preview-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product:
    uses: ./.github/workflows/novart-integration.yml
