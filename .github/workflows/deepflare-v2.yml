name: DeepFlare 2.0 database foundation
on:
  pull_request:
    branches: [df-2-sol]
  push:
    branches: [df-2-sol]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepflare-v2-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: deepflare_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integration -d deepflare_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DF_SOL_TEST_REDIS: "1"
      REDIS_URL: redis://127.0.0.1:6379
      BRANDAI_QUEUE_PREFIX: df-sol-intake-test
      DATABASE_URL: postgresql://integration:disposable-ci-only@127.0.0.1:5432/deepflare_v2_test?schema=novart_preview_df_2_sol
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply committed migrations to disposable database
        run: pnpm --filter @brandai/db exec prisma migrate deploy
      - name: Reapply migrations to verify no-op
        run: pnpm --filter @brandai/db exec prisma migrate deploy
      - name: Verify migrations used only the designated preview schema
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U integration -d deepflare_v2_test \
            -f scripts/check-sol-test-schema.sql
      - name: Verify real persistence, concurrency and authorization
        run: pnpm --filter @brandai/web exec vitest run --config vitest.v2-db.config.ts
