name: Novart backend integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: novart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: novart_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d novart_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://integration:disposable-ci-only@127.0.0.1:5432/novart_integration_test
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: disposable-novart-integration-ci-only
      AUTH_URL: http://127.0.0.1:3000
      AUTH_ALLOW_DEMO: '0'
      QUOTA_V1: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      WORKBENCH_TEST_MATERIAL_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv apps/ai/.venv
          apps/ai/.venv/bin/pip install -r apps/ai/requirements.txt
          pnpm -F web exec playwright install --with-deps chromium
      - name: Verify owned canvas adapters and compile the reviewed shell
        run: |
          pnpm -F web exec vitest run tests/owned-canvas.test.ts tests/owned-canvas-geometry.test.ts tests/owned-editor-api.test.ts
          apps/ai/.venv/bin/python scripts/export-novart-studio.py
          apps/ai/.venv/bin/python -B scripts/test-novart-studio-export.py
          apps/ai/.venv/bin/python -B scripts/test-novart-ci-branches.py
          node scripts/test-novart-canvas-ready.cjs
      - name: Owned shell and homepage protocol checks
        run: |
          node scripts/test-novart-product-worker.cjs
          node scripts/test-novart-owned-shell.cjs
          node scripts/test-novart-owned-home-start.cjs
          node scripts/check-novart-garage-container.cjs --static-check
          pnpm -F web exec tsx scripts/diagnose-studio-upload.ts --self-test
      - name: Owned React editor interaction regression with isolated fixtures
        shell: bash
        run: |
          # Reuse the Chromium installed by web's Playwright dependency. This
          # fixture gate is separate from the real database/worker acceptance.
          export NOVART_CHROMIUM_EXECUTABLE="$(pnpm -F web exec node -e 'process.stdout.write(require("playwright/test").chromium.executablePath())')"
          test -f "$NOVART_CHROMIUM_EXECUTABLE"
          mkdir -p apps/web/.novart-ui-artifacts
          NOVART_OWNED_REPORT=apps/web/.novart-ui-artifacts/owned-react-fixture.json node scripts/test-novart-owned-canvas-browser.cjs
          NOVART_ENGINE_REPORT=apps/web/.novart-ui-artifacts/owned-engine-fixture.json node scripts/test-novart-engine-browser.cjs
          NOVART_OWNED_LAYERS_ONLY=1 NOVART_OWNED_REPORT=apps/web/.novart-ui-artifacts/owned-layer-fixture.json node scripts/test-novart-owned-canvas-browser.cjs
          NOVART_KNOWLEDGE_REPORT=apps/web/.novart-ui-artifacts/brand-knowledge-fixture.json node scripts/test-novart-brand-knowledge-browser.cjs
          NOVART_LAYER_INBOX_REPORT=apps/web/.novart-ui-artifacts/layer-inbox-fixture.json node scripts/test-novart-layer-inbox.cjs
          NOVART_STUDIO_LAYOUT_REPORT=apps/web/.novart-ui-artifacts/studio-layout-fixture.json node scripts/test-novart-studio-layout-browser.cjs
          NOVART_BRAND_SWITCH_REPORT=apps/web/.novart-ui-artifacts/brand-switch-fixture.json node scripts/test-novart-brand-switcher-browser.cjs
          NOVART_HOME_LEAVE_REPORT=apps/web/.novart-ui-artifacts/home-brand-leave-fixture.json node scripts/test-novart-home-brand-leave-browser.cjs
          NOVART_BRAND_CREATION_REPORT=apps/web/.novart-ui-artifacts/brand-creation-recovery-fixture.json node scripts/test-novart-brand-creation-recovery-browser.cjs
          NOVART_AUTO_PSD_REPORT=apps/web/.novart-ui-artifacts/automatic-psd-fixture.json NOVART_AUTO_PSD_SCREENSHOT=apps/web/.novart-ui-artifacts/automatic-psd-fixture.png node scripts/test-novart-auto-psd-browser.cjs
          NOVART_IMAGE_CONTEXT_REPORT=apps/web/.novart-ui-artifacts/image-context-fixture.json node scripts/test-novart-image-context-browser.cjs
          NOVART_CONVERSATION_REPORT=apps/web/.novart-ui-artifacts/conversation-fixture.json node scripts/test-novart-conversation-browser.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('apps/web/.novart-ui-artifacts')
          engine = json.loads((root / 'owned-engine-fixture.json').read_text())
          assert engine['passed'] is True and engine['isolated'] is True
          assert engine['realBackend'] is False and engine['realProvider'] is False
          assert engine['providerCalls'] == 0 and not engine['externalRequests'] and not engine['errors']
          assert len(engine['checks']) == 9
          assert {'zoomed-hit-testing-drag-and-history-share-the-current-camera',
                  'engine-export-includes-offscreen-images-from-the-full-document',
                  'gzip-save-reopen-retains-all-226-records-camera-stacking-text-and-brush'} <= set(engine['checks'])
          for name, expected in (('owned-layer-fixture.json', 10), ('brand-knowledge-fixture.json', 14), ('layer-inbox-fixture.json', 16), ('studio-layout-fixture.json', 8), ('brand-switch-fixture.json', 9), ('home-brand-leave-fixture.json', 9), ('brand-creation-recovery-fixture.json', 15), ('image-context-fixture.json', 19)):
              report = json.loads((root / name).read_text())
              assert report['passed'] is True and report['isolated'] is True, name
              assert report['realBackend'] is False and report['realProvider'] is False, name
              assert report['providerCalls'] == 0, name
              assert not report['externalRequests'] and not report['errors'], name
              assert len(report['checks']) == expected, name
              assert all(isinstance(check, str) or check['status'] == 'PASS' for check in report['checks']), name
              print(f'PASS {name}: {expected} isolated interaction checks; no real provider or database acceptance claimed')
          report = json.loads((root / 'image-context-fixture.json').read_text())
          assert {'async-insertion-history-move', 'async-insertion-history-draw',
                  'async-insertion-history-cancel-move', 'async-insertion-during-erase'} <= set(report['checks'])
          report = json.loads((root / 'automatic-psd-fixture.json').read_text())
          assert report['passed'] is True and report['isolated'] is True
          assert report['realBackend'] is False and report['realProvider'] is False
          assert report['providerCalls'] == 0 and len(report['checks']) >= 7
          assert not report['externalRequests'] and not report['errors']
          assert all(isinstance(check, str) or check['status'] == 'PASS' for check in report['checks'])
          print('PASS automatic PSD selection, recovery and file-download interaction; isolated fixtures only')
          report = json.loads((root / 'conversation-fixture.json').read_text())
          assert report['passed'] is True and report['isolated'] is True
          assert report['realBackend'] is False and report['realProvider'] is False and report['realAuthentication'] is False
          assert report['providerCalls'] == 0 and len(report['checks']) >= 40
          assert {'explicit-composer-target-restores-from-server-draft-after-refresh',
                  'natural-language-with-explicit-target-modifies-one-image-and-retains-other-references',
                  'removing-the-selected-reference-clears-the-persisted-edit-target',
                  'single-image-natural-adjustment-no-longer-produces-generic-clarification',
                  'cancel-target-allows-new-generation-without-reusing-old-edit-target',
                  'persisted-target-selector-is-disabled-for-read-only-projects'} <= set(report['checks'])
          assert {'collapsed-settings-remain-editable-and-persist-after-refresh',
                  'failure-reedit-restores-prompt-references-target-and-size-without-submitting',
                  'failure-reedit-preserves-an-unsent-draft',
                  'read-only-failure-cannot-restore-or-submit-a-request',
                  'compact-result-hides-secondary-controls-without-removing-them',
                  'composer-and-settings-fit-desktop-mobile-and-short-window'} <= set(report['checks'])
          assert report['directGenerationPosts'] == 0 and report['archiveRetries'] == 3
          assert len(report['terminalStateEvidence']) >= 6
          assert all(item['before'] == item['after'] for scenario in report['terminalStateEvidence'] for item in scenario['messagePolls'])
          assert {'generation-failure-with-not-requested-archive-stops-progress-and-all-repeat-polls',
                  'pasted-error-notice-clarifies-without-generation-and-next-explicit-edit-still-works',
                  'explicit-archive-retry-clears-stale-message-error-and-never-resubmits-generation',
                  'late-archive-retry-response-preserves-latest-message-metadata-and-ready-state',
                  'late-poll-does-not-regress-newer-manual-read-or-message-metadata',
                  'later-authoritative-read-can-revoke-ready-results-without-permanent-client-freeze',
                  'archive-processing-deadline-keeps-polling-after-original-message-expired',
                  'explicit-archive-retry-resumes-polling-with-new-lease-after-message-expiry',
                  'quick-edit-during-inflight-send-cannot-replace-frozen-user-prompt-or-target',
                  'project-switch-clears-old-draft-and-ignores-aborted-poll-errors-and-receipts'} <= set(report['checks'])
          assert not report['externalRequests'] and not report['errors']
          assert all(isinstance(check, str) or check['status'] == 'PASS' for check in report['checks'])
          print('PASS conversation recovery and terminal-state interaction; isolated fixtures only')
          PY
      - name: Write and read actual layered PSD format proof
        run: |
          NOVART_PSD_PROOF_DIR=.novart-ui-artifacts/psd-file-proof pnpm -F web exec tsx scripts/verify-studio-psd-file.ts
          NOVART_PSD_MEMORY_PROOF_DIR=.novart-ui-artifacts/psd-memory-proof pnpm -F web exec tsx scripts/verify-studio-psd-memory.ts
      - name: Generate and migrate the disposable database
        run: |
          pnpm db:generate
          pnpm -F @brandai/db exec prisma migrate deploy
      - name: Start private disposable object storage
        shell: bash
        run: |
          docker build -t novart-ci-storage - < deploy/novart/Dockerfile.ci-storage
          storage_access=novart-ci-only
          storage_secret=$(openssl rand -hex 32)
          echo "::add-mask::$storage_secret"
          echo "NOVART_CI_STORAGE_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
          echo "NOVART_CI_STORAGE_ACCESS_KEY=$storage_access" >> "$GITHUB_ENV"
          echo "NOVART_CI_STORAGE_SECRET_KEY=$storage_secret" >> "$GITHUB_ENV"
          docker run -d --name novart-ci-storage --network host \
            -e MINIO_ROOT_USER="$storage_access" -e MINIO_ROOT_PASSWORD="$storage_secret" \
            novart-ci-storage server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
      - name: Configure storage only in the disposable database
        run: pnpm -F web exec tsx scripts/prepare-studio-storage.ts
      - name: Repository gates
        run: |
          pnpm test
          bash cds-release.sh check
          node --test scripts/test-project-release.mjs
          pnpm test:ai
          pnpm -F web typecheck
          pnpm -F web build
      - name: Prepare concurrent API and UI checks
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/novart-parallel-tests.sh" <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail
          logs=$(mktemp -d "$RUNNER_TEMP/novart-checks.XXXXXX")
          trap 'jobs -pr | xargs -r kill 2>/dev/null || true' EXIT
          pnpm -F web exec tsx scripts/verify-workbench-backend.ts > "$logs/backend.log" 2>&1 &
          backend_pid=$!
          pnpm -F web exec tsx scripts/verify-studio-ui.ts > "$logs/ui.log" 2>&1 &
          ui_pid=$!
          backend_status=0
          ui_status=0
          wait "$backend_pid" || backend_status=$?
          wait "$ui_pid" || ui_status=$?
          python - "$logs" <<'PY'
          import os, re, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          def redact_url(match):
              try:
                  value = urlsplit(match.group())
                  return value.scheme + '://' + (value.hostname or '') + (':' + str(value.port) if value.port else '') + value.path
              except ValueError:
                  return '[redacted URL]'
          for name in ('backend', 'ui'):
              text = (Path(sys.argv[1]) / (name + '.log')).read_text(errors='replace')
              for key in ('AUTH_SECRET', 'DATABASE_URL', 'REDIS_URL', 'GH_TOKEN', 'GITHUB_TOKEN', 'NOVART_CI_STORAGE_SECRET_KEY'):
                  if os.environ.get(key): text = text.replace(os.environ[key], '[redacted environment value]')
              text = re.sub(r'https?://[^\s\"\'<>]+', redact_url, text)
              text = re.sub(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}', '[redacted email]', text)
              text = re.sub(r'(?i)\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b', '[redacted fixture UUID]', text)
              print('::group::' + name + ' integration checks')
              print(text)
              print('::endgroup::')
          PY
          log_status=$?
          printf 'API checks exit: %s; UI checks exit: %s\n' "$backend_status" "$ui_status"
          if [ "$backend_status" -ne 0 ]; then exit "$backend_status"; fi
          if [ "$ui_status" -ne 0 ]; then exit "$ui_status"; fi
          exit "$log_status"
          BASH
      - name: Real login, owned canvas, database and durable upload acceptance
        shell: bash
        run: |
          finish_acceptance() {
            result=$?
            trap - EXIT
            set +e
            if [ "$result" -ne 0 ]; then
              # Keep raw service logs outside artifacts. The diagnostic script
              # emits only fixed categories, task states and readiness flags.
              timeout 40s pnpm -F web exec tsx scripts/diagnose-studio-upload.ts \
                --server-log /tmp/novart-integration-server.log \
                --worker-log /tmp/novart-integration-worker.log
            fi
            kill -- -"$SERVER_PID" -"$WORKER_PID" 2>/dev/null || true
            wait "$SERVER_PID" "$WORKER_PID" 2>/dev/null || true
            exit "$result"
          }
          setsid pnpm -F web start > /tmp/novart-integration-server.log 2>&1 &
          SERVER_PID=$!
          setsid pnpm -F web worker > /tmp/novart-integration-worker.log 2>&1 &
          WORKER_PID=$!
          trap finish_acceptance EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/auth/csrf >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health | python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("worker") == "ok" else 1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          bash "$RUNNER_TEMP/novart-parallel-tests.sh"
      - name: Check the real knowledge journey and truthful layer acceptance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('apps/web/.novart-ui-artifacts/port-3000/acceptance.json').read_text())
          assert report['realDatabase'] is True and report['realKnowledge'] is True and report['realBrands'] is True
          assert len(report['knowledgeChecks']) >= 4
          assert report['realDecomposition'] is False and report['realGeneration'] is False
          print('PASS real authenticated knowledge UI/database journey; real layer-model quality is still deferred')
          PY
      # Paid provider acceptance remains opt-in outside this core CI job.
      # Knowledge uses the real DB; unconfigured layers must preserve source.
      - name: Prepare and build immutable CDS images
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .novart-build/next
          rsync -a --exclude cache apps/web/.next/ .novart-build/next/
          WEB_IMAGE="ghcr.io/${REPOSITORY,,}/novart-product-web:sha-${COMMIT_SHA}"
          AI_IMAGE="ghcr.io/${REPOSITORY,,}/novart-product-ai:sha-${COMMIT_SHA}"
          STORAGE_IMAGE="ghcr.io/${REPOSITORY,,}/novart-product-storage:sha-${COMMIT_SHA}"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
          echo "AI_IMAGE=$AI_IMAGE" >> "$GITHUB_ENV"
          echo "STORAGE_IMAGE=$STORAGE_IMAGE" >> "$GITHUB_ENV"
          docker build -f deploy/novart/Dockerfile.web --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" -t "$WEB_IMAGE" .
          docker build -f deploy/novart/Dockerfile.ai --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" -t "$AI_IMAGE" .
          # The build context contains only the public config and Dockerfile.
          # No host checkout mount is needed by the resulting Garage image.
          docker build -f deploy/novart/storage/Dockerfile --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" -t "$STORAGE_IMAGE" deploy/novart/storage
      - name: Validate Garage storage image and durable permissions
        id: garage_storage_gate
        timeout-minutes: 8
        env:
          COMMIT_SHA: ${{ github.sha }}
          NOVART_GARAGE_NETWORK: ${{ job.services.postgres.network }}
          NOVART_GARAGE_NETWORK_ANCHOR: ${{ job.services.postgres.id }}
        # No published ports: the Linux runner reaches the container's bridge
        # address on the existing service network. The script creates, labels
        # and disposes only its own new containers, volumes and test objects.
        run: node scripts/check-novart-garage-container.cjs
      - name: Check the built containers against the disposable database
        run: |
          finish_containers() {
            result=$?
            trap - EXIT
            set +e
            if [ "$result" -ne 0 ]; then
              umask 077
              docker logs novart-ci-web > "$RUNNER_TEMP/novart-container-server.log" 2>&1
              docker logs novart-ci-worker > "$RUNNER_TEMP/novart-container-worker.log" 2>&1
              WORKBENCH_TEST_URL=http://127.0.0.1:3100 timeout 40s pnpm -F web exec tsx scripts/diagnose-studio-upload.ts \
                --server-log "$RUNNER_TEMP/novart-container-server.log" \
                --worker-log "$RUNNER_TEMP/novart-container-worker.log"
            fi
            docker rm -f novart-ci-web novart-ci-ai novart-ci-worker >/dev/null 2>&1 || true
            exit "$result"
          }
          trap finish_containers EXIT
          docker run -d --name novart-ci-ai --network host "$AI_IMAGE"
          docker run -d --name novart-ci-web --network host \
            -e DATABASE_URL -e REDIS_URL -e AUTH_SECRET -e QUOTA_V1 -e AUTH_ALLOW_DEMO \
            -e AUTH_URL=http://127.0.0.1:3100 -e AI_SERVICE_URL=http://127.0.0.1:8000 \
            -e WORKER_HEALTH_URL=http://127.0.0.1:3001 "$WEB_IMAGE" \
            sh -c 'pnpm -F @brandai/db exec prisma migrate deploy && exec pnpm -F web exec next start -p 3100'
          docker run -d --name novart-ci-worker --network host \
            -e DATABASE_URL -e REDIS_URL -e AUTH_SECRET -e AI_SERVICE_URL=http://127.0.0.1:8000 \
            "$WEB_IMAGE" pnpm -F web worker
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/auth/csrf >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          WORKBENCH_TEST_URL=http://127.0.0.1:3100 bash "$RUNNER_TEMP/novart-parallel-tests.sh"
          # Prove the packaged ag-psd module and Worker writer are available in
          # the actual built image, independently of real model acceptance.
          docker exec novart-ci-web pnpm -F web exec tsx scripts/verify-studio-psd-file.ts
          docker exec novart-ci-web pnpm -F web exec tsx scripts/verify-studio-psd-memory.ts
          # Source-level TS checks miss Webpack rewriting a Node worker's
          # module path to a numeric bundle ID. Exercise the packaged codec.
          docker exec novart-ci-web pnpm -F web exec node scripts/verify-studio-psd-built.cjs
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          report = json.loads(Path('apps/web/.novart-ui-artifacts/port-3100/acceptance.json').read_text())
          assert report['realDatabase'] is True and report['realKnowledge'] is True and report['realBrands'] is True
          assert len(report['knowledgeChecks']) >= 4
          assert report['realDecomposition'] is False and report['realGeneration'] is False
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10) as response:
              ai_health = json.load(response)
          assert ai_health.get('studioDecompositionRevision') == 'studio-real-layer-single-attempt-r1', 'Built AI layer revision mismatch'
          assert ai_health.get('studioDecompositionQueueRevision') == 'studio-layer-queue-r1', 'Built AI durable layer queue revision mismatch'
          assert ai_health.get('providerRetryRevision') == 'single-provider-attempt-r2', 'Built AI must match the Web r2 single-attempt contract'
          print('PASS built AI container advertises real-layer and single-attempt capabilities; no model call made')
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3100/api/health', timeout=10) as response:
                      health = json.load(response)
                  if health['web'] == 'ok' and health['ai'] == 'ok' and health['worker']['worker'] == 'ok':
                      print('PASS built Web, AI and Worker containers are healthy; no provider calls made')
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Built container health checks did not pass')
          PY
      - name: Publish checked Garage storage image
        id: publish_garage_storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$STORAGE_IMAGE"
      - name: Publish checked images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$WEB_IMAGE"
          docker push "$AI_IMAGE"
          docker logout ghcr.io
      - name: Dispose of integration storage and objects
        if: always()
        run: docker rm -f novart-ci-storage >/dev/null 2>&1 || true
      - name: Preserve owned canvas acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novart-owned-ui-${{ github.run_id }}
          # v4 excludes dot-directories unless explicitly enabled. Whitelist
          # only known test outputs; never upload raw logs or diagnostics.json.
          path: |
            apps/web/.novart-ui-artifacts/owned-react-fixture.json
            apps/web/.novart-ui-artifacts/owned-engine-fixture.json
            apps/web/.novart-ui-artifacts/owned-layer-fixture.json
            apps/web/.novart-ui-artifacts/brand-knowledge-fixture.json
            apps/web/.novart-ui-artifacts/layer-inbox-fixture.json
            apps/web/.novart-ui-artifacts/studio-layout-fixture.json
            apps/web/.novart-ui-artifacts/brand-switch-fixture.json
            apps/web/.novart-ui-artifacts/home-brand-leave-fixture.json
            apps/web/.novart-ui-artifacts/brand-creation-recovery-fixture.json
